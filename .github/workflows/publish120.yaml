name: Publish to 120 server

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - 'apps/main-project/**'

jobs:
  publish:
    name: Publish to 120server
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 安装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

        # 3. 安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/main-project
        run: pnpm run build --mode prod.hw120

      - name: Inspect local dist before upload
        run: |
          set -x
          pwd
          echo "dist real path:"
          realpath apps/main-project/dist
          echo "dist summary:"
          du -sh apps/main-project/dist || true
          echo "dist file count:"
          find apps/main-project/dist -type f | wc -l
          echo "top dist files:"
          find apps/main-project/dist -type f -printf '%s %p\n' | sort -nr | head -n 20
          echo "runner disk:"
          df -h
      # - name: Create test dist
      #   run: |
      #     mkdir -p apps/main-project/dist
      #     echo "test publish 120 $(date +%Y-%m-%dT%H:%M:%S)" > apps/main-project/dist/test.txt
      # - name: test
      #   working-directory: apps/main-project
      #   run: |
      #     mkdir dist

      - name: Clean old dist before upload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ${{ secrets.HW_MAIN_DEPLOY_PATH }}
            echo "部署目录逻辑路径:"
            pwd
            echo "部署目录物理路径:"
            pwd -P
            echo "部署目录磁盘:"
            df -h .
            echo "部署目录 inode:"
            df -ih .
            echo "部署目录内容:"
            ls -la
            echo "上传前删除旧 dist 与临时包，避免磁盘占满"
            rm -rf ./dist
            rm -rf ./temp/*
            mkdir -p ./temp ./scp-tmp
            rm -f ./scp-tmp/*.tar.gz
            echo "temp 目录状态:"
            ls -ld ./temp
            df -h ./temp
            echo "scp-tmp 目录状态:"
            ls -ld ./scp-tmp
            df -h ./scp-tmp

      - name: Upload new dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 120 nginx-ui container mount: host /vdbdata/smarttt_frontend_dist -> container /var/www.
          # HW_MAIN_DEPLOY_PATH should be /vdbdata/smarttt_frontend_dist.
          # Upload lands in ${HW_MAIN_DEPLOY_PATH}/temp first; Deploy copies it to ${HW_MAIN_DEPLOY_PATH}/dist.
          # Final static files: host /vdbdata/smarttt_frontend_dist/dist, container /var/www/dist.
          source: 'apps/main-project/dist/*'
          target: ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp
          tar_tmp_path: ${{ secrets.HW_MAIN_DEPLOY_PATH }}/scp-tmp/
          strip_components: 3
          overwrite: true
          rm: true
          debug: true

      - name: Inspect remote temp after upload failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -x
            cd ${{ secrets.HW_MAIN_DEPLOY_PATH }}
            pwd
            pwd -P
            df -h .
            df -ih .
            ls -la
            mkdir -p ./temp
            echo "temp summary:"
            ls -la ./temp
            du -sh ./temp 2>/dev/null || true
            find ./temp -maxdepth 2 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 20 || true
            echo "recent oom logs:"
            dmesg -T 2>/dev/null | egrep -i "out of memory|oom|killed process|cannot allocate" | tail -n 50 || true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e  # 只要有一个命令失败，整个脚本立即退出
            cd ${{ secrets.HW_MAIN_DEPLOY_PATH }}
            echo "部署前目录状态:"
            pwd
            pwd -P
            df -h .
            df -ih .
            echo "temp 内容:"
            ls -la ./temp
            du -sh ./temp 2>/dev/null || true
            mkdir -p ./dist
            echo "从临时文件夹中复制到目标文件夹"
            if [ -z "$(ls -A ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp 2>/dev/null)" ]; then
              echo "上传目录为空，终止部署"
              exit 1
            fi
            cp -r ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp/* ${{ secrets.HW_MAIN_DEPLOY_PATH }}/dist
            echo "删除临时dist" 
            rm -rf ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp/*
            echo "执行重启脚本"
            cd /root/smarttt/smarttt_new/smarttt_frontend
            ./restart_nginx.sh
