name: Publish to 120 server

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - 'apps/main-project/**'

jobs:
  publish:
    name: Publish to 120server
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 安装 Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

        # 3. 安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: apps/main-project
        run: pnpm run build -- --mode prod.hw120
      # - name: test
      #   working-directory: apps/main-project
      #   run: |
      #     mkdir dist

      - name: Upload new dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'apps/main-project/dist'
          target: ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HW_MAIN_SERVER_HOST }}
          username: ${{ secrets.HW_MAIN_SERVER_USER }}
          key: ${{ secrets.HW_MAIN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e  # 只要有一个命令失败，整个脚本立即退出
            cd ${{ secrets.HW_MAIN_DEPLOY_PATH }}
            echo "删除旧包"
            rm -rf ./dist
            mkdir ./dist
            echo "从临时文件夹中复制到目标文件夹"
            cp -r ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp/apps/main-project/dist/* ${{ secrets.HW_MAIN_DEPLOY_PATH }}/dist || true
            echo "删除临时dist" 
            rm -rf ${{ secrets.HW_MAIN_DEPLOY_PATH }}/temp/*
            echo "执行重启脚本"
